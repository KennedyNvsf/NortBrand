name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Placeholder values so env validation and the build can run in CI. They are not
  # secrets and point nowhere, and no job needs a real one: e2e runs on the fake
  # backend, pgTAP sets its own Vault secret. The real values live in Vercel, and the
  # e2e (preview) job tests the deployment that uses them (#45).
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  NEXT_PUBLIC_SANITY_PROJECT_ID: placeholder
  NEXT_PUBLIC_SANITY_DATASET: production
  NEXT_PUBLIC_GA_MEASUREMENT_ID: G-PLACEHOLDER
  SANITY_API_READ_TOKEN: placeholder
  SANITY_REVALIDATE_SECRET: placeholder-placeholder-placeholder-00
  RESEND_API_KEY: re_placeholder
  RESEND_SEGMENT_ID: placeholder
  RESEND_WEBHOOK_SECRET: whsec_cGxhY2Vob2xkZXItcGxhY2Vob2xkZXI=
  EMAIL_FROM: NortBrand <onboarding@resend.dev>
  NOTIFY_TO_EMAIL: team@example.com
  IP_HASH_SALT: placeholder-placeholder-placeholder-00
  NEWSLETTER_TOKEN_SECRET: placeholder-placeholder-placeholder-00

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Typecheck runs `next typegen` first; lint relies on the generated route types.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      # Blog posts are prerendered from their slugs at build time (#61). The Sanity
      # project above is a placeholder, so the build reads the blog fixtures, as e2e
      # does. Vercel builds use the real dataset.
      - name: Build
        run: pnpm build
        env:
          E2E_FAKE_BACKEND: "1"

      # ADR-009, #132: the service-role key must never reach a browser.
      - name: Client bundles hold no service-role key
        run: pnpm check:bundles

  # Playwright against this PR's own production build (playwright.config.ts starts
  # `pnpm build && pnpm start` with E2E_FAKE_BACKEND=1, so nothing reaches Supabase,
  # Resend or Google). One job per project, so each browser is its own check. The
  # e2e-preview job below runs the host-independent specs against the PR's preview.
  e2e:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Desktop and mobile (iPhone 14 viewport and touch) in Chromium, both required.
        # Real WebKit ran here as two informational shards until #184; it hangs and
        # crashes intermittently on these runners and cost the most minutes, so it runs
        # locally now (`pnpm test:e2e`, project "mobile"; docs/guides/ci.md).
        include:
          - check: e2e (desktop)
            project: desktop
            browser: chromium
            shard: 1/1
          - check: e2e (mobile)
            project: mobile-chromium
            browser: chromium
            shard: 1/1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright (${{ matrix.project }}, shard ${{ matrix.shard }})
        run: pnpm test:e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Playwright against this PR's own Vercel preview (#45): the real deployment, with its
  # CDN, functions and environment. Vercel posts only a commit status here (no GitHub
  # deployment events), so the job asks the Vercel API for the preview built from the
  # PR's head commit and waits until it is READY. Specs that need the fake backend or
  # their own browser state stay on the local-build jobs above (tests/e2e/target.ts).
  # The bypass secret becomes a cookie in preview-setup.ts and is never sent to other
  # hosts. Skipped on PRs from forks, which get no secrets.
  e2e-preview:
    name: e2e (preview)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_PROJECT_ID: prj_WVusCvOCYcgFUQ8TbKfbGx5zGE04
      VERCEL_TEAM_ID: team_kgRrJqdXGq4CSEz8KYU29a9H
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Up to 20 minutes: a preview build takes about one minute, but queues behind
      # other builds on the team. ERROR or CANCELED fails straight away.
      - name: Wait for this commit's Vercel preview
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          api="https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&sha=$HEAD_SHA&limit=5"
          for attempt in $(seq 1 80); do
            preview=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$api" \
              | jq -c '[.deployments[] | select(.target == null)] | first // empty')
            state=$(jq -r '.state // .readyState // empty' <<<"$preview")
            echo "attempt $attempt: ${state:-not created yet}"
            case "$state" in
              READY)
                url="https://$(jq -r .url <<<"$preview")"
                echo "url=$url" >> "$GITHUB_OUTPUT"
                echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              ERROR|CANCELED)
                echo "::error::The Vercel preview for $HEAD_SHA is $state."
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::No READY Vercel preview for $HEAD_SHA after 20 minutes."
          exit 1

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright against the preview (desktop, mobile Chromium)
        run: pnpm test:e2e --project=desktop --project=mobile-chromium
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-preview
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Lighthouse budgets (#83) on 5 pages x EN/PT, mobile profile, against this PR's own
  # production build with the fake backend, like e2e. Budgets live in lighthouserc.json.
  # @lhci/cli runs through `pnpm lhci` (pnpm dlx, exact version) and is deliberately not in
  # package.json: its Lighthouse/Puppeteer tree carries high audit findings that would
  # break the go-live audit gate (decided 2026-11-05, docs/guides/dependencies.md). This
  # job has read-only permissions and no secrets. Reports are a workflow artifact, not
  # public storage: the site is not launched. Moves to Vercel previews with #45.
  lighthouse:
    name: Lighthouse (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          E2E_FAKE_BACKEND: "1"

      # collect starts `pnpm start` itself (lighthouserc.json); Chrome is preinstalled
      # on GitHub's Ubuntu runners.
      - name: Run Lighthouse
        run: pnpm lhci collect
        env:
          E2E_FAKE_BACKEND: "1"

      - name: Save the reports
        if: always()
        run: pnpm lhci upload

      - name: Score table in the run summary
        if: always()
        run: pnpm --silent lighthouse:summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14

      # Last, so the summary and the reports exist even when a budget fails.
      - name: Check the budgets
        run: pnpm lhci assert

  # pgTAP against a fresh local database with every migration applied (#36), so a
  # migration cannot weaken RLS or the write functions unnoticed. Docker is available
  # on GitHub's Ubuntu runners; only Postgres is started.
  database:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Postgres plus Storage (#135: the portal-files bucket and its read rule need the
      # storage schema). Services the tests don't use are skipped. The reset re-applies
      # every migration once Storage has created its schema, whatever order start used.
      - name: Start Postgres and Storage with all migrations
        run: |
          pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,supavisor
          pnpm exec supabase db reset --local

      - name: Run the pgTAP suite
        run: pnpm db:test
